<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h1 class="mb-4 text-center">My Orders</h1>

    <div class="table-responsive">
        <!-- Product List -->
        <table class="table table-bordered table-hover align-middle">
            <thead>
            <tr>
                <th>Order ID</th>
                <th>Created At</th>
                <th>Status</th>
                <th>Total</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.getOrderId()}"></td>
                <td th:text="${order.getCreatedAt()}"></td>
                <td th:text="Confirmed"></td>
                <td>$<span th:text="${order.getGrandTotal()}">0.00</span></td>
                <td>
                    <form th:action="@{/orders/cancel(id=${order.getOrderId()})}" method="POST" class="d-inline">
                        <input type="hidden" name="_method" value="delete" />
                        <button type="submit" class="btn btn-danger btn-sm">Cancel</button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/}" class="btn btn-primary">Continue Shopping</a>
    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
