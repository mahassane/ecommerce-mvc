<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 1rem;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-container button {
            width: 100%;
            padding: 0.5rem;
            background: #007BFF;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
        }

        .login-container button:hover {
            background: #0056b3;
        }

        .login-container .message {
            margin-top: 1rem;
            text-align: center;
            color: red;
        }

        .signup-link {
            display: block;
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #007BFF;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

<div class="login-container">
    <h2>Login</h2>
    <form method="POST" th:action="@{/login}" th:object="${user}">
        <input type="text" name="email" th:field="*{email}" placeholder="Email" required>
        <br><br>
        <input type="password" name="password" th:field="*{password}" placeholder="Password" required>
        <br><br>
        <button type="submit">Login</button>
    </form>

    <div class="signup-link">
        <a th:href="@{/signup}">Don't have an account? Sign up</a>
    </div>

    <!-- Hidden alert -->
    <div class="message" th:if="${badCredentials}">
        Bad Credentials
    </div>

</div>

</body>
</html>
