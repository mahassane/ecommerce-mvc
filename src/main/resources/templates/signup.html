<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Sign Up</title>
  <style>
    body {
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .signup-container {
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }

    .signup-container h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    .signup-container input[type="text"],
    .signup-container input[type="password"] {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .signup-container button {
      width: 100%;
      padding: 0.5rem;
      background: #007BFF;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 1rem;
    }

    .signup-container button:hover {
      background: #0056b3;
    }

    .signup-container .message {
      margin-top: 1rem;
      text-align: center;
      color: red;
    }
  </style>
</head>
<body>

<div class="signup-container">
  <h2>Sign Up</h2>
  <form method="POST" th:action="@{/signup}" th:object="${user}">
    <input type="text" name="firstname" th:field="*{firstName}" placeholder="First Name" required>
    <br>
    <input type="text" name="lastname" th:field="*{lastName}" placeholder="Last Name" required>
    <br>
    <input type="text" name="email" th:field="*{email}" placeholder="Email" required>
    <br>
    <input type="password" name="password" th:field="*{password}" placeholder="Password" required>
    <br><br>
    <button type="submit">Create Account</button>
  </form>
  <!-- Hidden alert -->
  <div class="message" th:if="${inValidEmail}" th:text="${inValidEmail}"/>
</div>

</body>
</html>
