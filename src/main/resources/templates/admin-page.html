<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h1 class="mb-4">Admin Panel</h1>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Tabs nav -->
        <ul class="nav nav-tabs" id="adminTab" role="tablist" style="flex-grow: 1;">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button" role="tab">Orders</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button" role="tab">Users</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button" role="tab">Products</button>
            </li>
        </ul>

        <!-- Logout button -->
        <form th:action="@{/logout}" method="GET" class="ms-3 mb-0">
            <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
    </div>


    <!-- Tab panes -->
    <div class="tab-content mt-3">
        <!-- Orders Tab -->
        <div class="tab-pane fade show active" id="orders" role="tabpanel">
            <h3>All Orders</h3>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>User ID</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Created At</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.getOrderId()}">1</td>
                    <td th:text="${order.getUserId().getUserId()}">100-</td>
                    <td th:text="${order.getQuantity()}">0</td>
                    <td>$<span th:text="${order.getGrandTotal()}">0.00</span></td>
                    <td th:text="${order.getCreatedAt()}">2025-07-01</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Users Tab -->
        <div class="tab-pane fade" id="users" role="tabpanel">
            <h3>All Users</h3>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>User ID</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Joined At</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.getUserId()}">1</td>
                    <td th:text="${user.getEmail()}">user@example.com</td>
                    <td th:text="${user.getRole()}">USER</td>
                    <td th:text="${user.getJoinedAt()}">2025-07-01</td>
                    <td>
                        <form th:action="@{/admin/removeUser(id=${user.userId})}" method="POST" th:if="${user.role != 'admin'}">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Products Tab -->
        <div class="tab-pane fade" id="products" role="tabpanel">
            <h3>Manage Products</h3>

            <!-- Product List -->
            <table class="table table-striped mb-4">
                <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.getPid()}">1</td>
                    <td th:text="${product.getPname()}">Product Name</td>
                    <td>$<span th:text="${product.getPrice()}">0.00</span></td>
                    <td>
                        <form th:action="@{/admin/removeProduct(id=${product.getPid()})}" method="POST" class="d-inline">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                        </form>
                    </td>

                </tr>
                </tbody>
            </table>

            <!-- Add Product Form -->
            <h4>Add New Product</h4>
            <form th:action="@{/admin/addProduct}" method="post" th:object="${newProduct}">
                <input type="hidden" />

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" th:field="*{pname}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Price</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Image URL</label>
                    <input type="text" class="form-control" th:field="*{imageUrl}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Add Product</button>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Check if there is a hash in the URL
        const hash = window.location.hash;
        if (hash) {
            // Find the tab button corresponding to the hash
            const tabButton = document.querySelector(hash + '-tab');
            if (tabButton) {
                // Use Bootstrap's Tab API to show the tab
                const tab = new bootstrap.Tab(tabButton);
                tab.show();
            }
        }
    });
</script>
</body>
</html>
