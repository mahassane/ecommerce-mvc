<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Shop</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />

    <!-- Fonts and Icons -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />

    <!-- Bootstrap + Theme CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">

    <style>
        html {
            scroll-behavior: smooth;
        }
        .card-body {
            display: flex;
            flex-direction: column;
        }

        .card-body .card-text.description {
            display: -webkit-box;
            -webkit-line-clamp: 2;      /* limit to 2 lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 1rem;       /* space above button */
            flex-grow: 1;              /* take up remaining space */
        }

        .card-body form {
            margin-top: auto;          /* push button to bottom */
        }

        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>


</head>
<body id="page-top">


<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/ecommerce}">My Shop</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            Menu <i class="fas fa-bars ms-1"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
                <li class="nav-item">
                    <a class="nav-link position-relative" th:href="@{/ecommerce/cart}">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="badge bg-danger position-absolute top-0 start-100 translate-middle"
                              th:text="${cart_count}">0</span>
                    </a>
                </li>

                <li class="nav-item" th:if="${!loggedIn}">
                    <a class="nav-link" th:href="@{/ecommerce/login}">
                        <i class="fas fa-user"></i> Login
                    </a>
                </li>

                <li class="nav-item dropdown" th:if="${loggedIn}">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/ecommerce/profile}">View Profile</a></li>
                        <li><a class="dropdown-item" th:href="@{/ecommerce/orders}">My Orders</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/ecommerce/logout}">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>


<!-- Masthead -->
<header id="vanta-bg" class="masthead" style="height: 800px; position: relative; overflow: hidden;">
    <div class="container position-relative" style="z-index: 2;">
        <div class="masthead-subheading">Welcome To Our E-Shop!</div>
        <div class="masthead-heading text-uppercase">WORLD X TECHNOLOGY</div>
        <a class="btn btn-primary btn-xl text-uppercase" style="position: relative; z-index: 3;" href="#products">Tell Me More</a>

        <img src="/assets/img/map-image.png" alt="Background" class="map-image"
             style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);  z-index: 1;"/>
    </div>
</header>

<!-- Services Section -->
<section class="page-section">
</section>

<!-- Portfolio Section -->
<section class="page-section">
</section>

<audio id="bg-music" loop>
    <source src="/assets/audio/Radiant%20Shuffle.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<!-- Product Grid -->
<div class="container my-5" id="products">
    <h1 class="text-center mb-4">Our Products</h1>
    <div class="row g-4">
        <div class="col-sm-6 col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card h-100">
                <img th:src="${product.imageUrl}" class="card-img-top" th:alt="${product.pname}"
                     style="width: 100%; height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.pname}">Product Name</h5>
                    <p class="card-text">$<span th:text="${product.price}">0.00</span></p>
                    <p class="card-text" th:text="${product.description}"
                       style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;">
                        Short product description</p>
                    <form th:action="@{/ecommerce/cart/add}" method="post">
                        <input type="hidden" name="id" th:value="${product.getPid()}" />
                        <button type="submit" class="btn btn-primary w-100">Add to Cart</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer py-4 bg-dark text-white">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-4 text-lg-start">&copy; 2025 E-Shop</div>
        </div>
    </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/scripts.js"></script>
<script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.topology.min.js"></script>
<script>
    document.addEventListener('click', function handler() {
        const audio = document.getElementById('bg-music');
        audio.play().catch(err => {
            console.log('Playback prevented:', err);
        });
        document.removeEventListener('click', handler);
    });
</script>
<script>
    VANTA.TOPOLOGY({
        el: "#vanta-bg",
        color: 0x8298b0,
        backgroundColor: 0x000000,
        shininess: 50,
        waveHeight: 20,
        waveSpeed: 1.0,
        zoom: 1.0
    })
</script>
</body>
</html>
