<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/ecommerce}">My Shop</a>
    </div>
</nav>

<div class="container my-5">
    <h1 class="mb-4">Checkout</h1>

    <div class="row">
        <!-- Billing Info -->
        <div class="col-md-6">
            <h4>Billing Information</h4>
            <form th:action="@{/ecommerce/order}" th:object="${order}" method="post">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="fullName" th:value="${order.fullName}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" th:value="${order.email}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" name="address" rows="2" th:value="${order.address}" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" name="paymentMethod" th:value="${order.paymentMethod}" required>
                        <option value="">Select a method</option>
                        <option value="credit">Credit Card</option>
                        <option value="paypal">PayPal</option>
                        <option value="cod">Cash on Delivery</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Place Order</button>
                <a class="btn btn-secondary" th:href="@{/ecommerce/cart}">Back to Cart</a>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="col-md-6">
            <h4>Order Summary</h4>
            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between"
                    th:each="item : ${cart}">
                    <div>
                        <h6 class="my-0" th:text="${item.getProduct().getPname()}">Product Name</h6>
                        <small class="text-muted" th:text="'Qty: ' + ${item.getQuantity()}">Qty: 1</small>
                    </div>
                    <span class="text-muted"
                          th:text="'$' + ${item.getProduct().getPrice() * item.getQuantity()}">
                        $0.00
                    </span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <strong>Total</strong>
                    <strong th:text="'$' + ${total}">$0.00</strong>
                </li>
            </ul>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3">
    &copy; 2025 My Shop. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
