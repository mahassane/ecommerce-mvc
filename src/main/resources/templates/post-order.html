<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div class="container text-center my-5">
    <div class="card shadow-lg p-4 rounded-4">
        <div class="card-body">
            <h1 class="text-success mb-3">
                <i class="bi bi-check-circle-fill"></i>
                Order Placed Successfully!
            </h1>
            <p class="lead mb-4">Thank you for your purchase. Your order has been placed successfully.</p>
            <div class="d-flex justify-content-center gap-3">
                <a th:href="@{/}" class="btn btn-primary btn-lg">Continue Shopping</a>
                <a th:href="@{/orders}" class="btn btn-outline-secondary btn-lg">My Orders</a>
            </div>
        </div>
    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
<link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
        rel="stylesheet">
</body>
</html>
