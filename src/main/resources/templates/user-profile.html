<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/ecommerce}">My Shop</a>
    <div class="d-flex align-items-center ms-auto">
      <a href="#" class="btn btn-outline-light me-2">
        <i class="bi bi-cart3"></i> Cart
      </a>
      <div class="dropdown">
        <a class="btn btn-outline-light dropdown-toggle" href="#" role="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle"></i> Profile
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
          <li><a class="dropdown-item" th:href="@{/ecommerce/profile}">View Profile</a></li>
          <li><a class="dropdown-item" th:href="@{/ecommerce/orders}">My Orders</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" th:href="@{/ecommerce/logout}">Logout</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<div class="container my-5">
  <h1 class="text-center mb-4">User Profile</h1>
  <div class="card mx-auto" style="max-width: 400px;">
    <div class="card-body" th:object="${user}">
      <h5 class="card-title" th:text="|${user.getFirstName()} ${user.getLastName()}|">Full Name</h5>
      <p class="card-text"><strong>Email:</strong> <span th:text="${user.getEmail()}">user@example.com</span></p>
      <p class="card-text"><strong>Joined at:</strong> <span th:text="${user.getJoinedAt()}">2025-01-01</span></p>
      <button class="btn btn-primary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#editProfileForm" aria-expanded="false" aria-controls="editProfileForm">
        Edit Profile
      </button>
    </div>
  </div>

  <!-- Hidden alert -->
  <div class="alert alert-danger mt-3 mx-auto text-center collapse" id="emailExistsAlert" style="max-width: 400px;"
       th:classappend="${emailError} ? 'show'">
    Email address already in use.
  </div>

  <!-- Hidden edit form -->
  <div class="collapse mt-3" id="editProfileForm">
    <div class="card mx-auto" style="max-width: 400px;">
      <div class="card-body">
        <form th:action="@{/ecommerce/updateProfile}" method="post">
          <div class="mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" name="firstName" th:value="${user.firstName}" required>
          </div>
          <div class="mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" name="lastName" th:value="${user.lastName}" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${user.email}" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">New Password (Optional)</label>
            <input type="password" class="form-control" id="password" name="password">
          </div>

          <button type="submit" class="btn btn-success w-100">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<footer class="bg-dark text-white text-center py-3">
  &copy; 2025 My Shop. All rights reserved.
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
